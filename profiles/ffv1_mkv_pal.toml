# SMPL vendor-qc policy profile: FFV1 version 3 Matroska PAL.
# Derived from vrecord's policy fragment library (CC BY 4.0):
# https://github.com/amiaopensource/vrecord

[profile]
name = "ffv1_mkv_pal"
description = "FFV1 version 3 PAL in Matroska — vendor delivery spec"
container_extensions = [".mkv"]
mediaconch_policy = "ffv1_mkv_pal.xml"

[video]
codec = "ffv1"
width = 720
height = 576
fps_num = 25
fps_den = 1
bit_depth = 10
scan_type = "interlaced"
field_order = ["tt", "tb"]    # both indicate TFF for PAL

[audio]
codec_prefix = "pcm"          # pcm_s24le
bit_depth = 24
sample_rate = 48000
min_streams = 1

[thresholds]
av_duration_threshold_s = 1.0
av_delay_threshold_s = 0.001
spin_down_zone = 0.97
frame_anomaly_low_ratio = 0.5
frame_anomaly_high_ratio = 1.5
