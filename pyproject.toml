[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqc"
dynamic = ["version"]
description = "SMPL QC tool for vendor-delivered and donor-received video/audio: vendor-qc (spec conformance) and donor-triage (well-formedness) modes"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Stanford Media Preservation Lab" }
]
requires-python = ">=3.11"
dependencies = [
    "tqdm>=4.65",
]

[project.scripts]
sqc = "sqc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sqc._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
